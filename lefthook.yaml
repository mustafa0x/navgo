pre-commit:
    commands:
        oxfmt:
            glob: '*.{js,ts,svelte,html,css}'
            run: pnpm exec oxfmt -c .oxfmtrc.json {staged_files}
            stage_fixed: true

        oxlint:
            glob: '*.{js,ts,svelte}'
            run: pnpm exec oxlint --fix -c oxlint.config.js {staged_files}
            stage_fixed: true

        tests:
            glob: '*.{js,ts}'
            run: pnpm test
